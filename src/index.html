<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Politica de seguridad: solo scripts propios, e imagenes/datos de la API -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; img-src 'self' https://rickandmortyapi.com; connect-src https://rickandmortyapi.com; style-src 'self'; script-src 'self'">
    <title>Rick and Morty Explorer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="topbar">
        <h1>Rick and Morty <span>Explorer</span></h1>
        <p id="electron-version"></p>
    </header>

    <main class="contenedor">

        <section id="loading-data" class="loading">
            <div class="spinner"></div>
            <strong>Cargando personajes...</strong>
        </section>

        <p id="mensaje-error" class="mensaje-error d-none" role="alert"></p>
        <button id="btn-reintentar" type="button" class="btn-reintentar d-none">Reintentar</button>

        <div id="card-dinamica" class="grid"></div>

        <nav class="paginacion">
            <button id="btn-anterior" disabled>&larr; Anterior</button>
            <span id="pagina-actual">Página 1</span>
            <button id="btn-siguiente">Siguiente &rarr;</button>
        </nav>

    </main>

    <!-- Template: este HTML no se renderiza hasta que se clona desde JavaScript -->
    <template id="template-card">
        <article class="tarjeta">
            <img class="tarjeta-img" alt="">
            <div class="tarjeta-cuerpo">
                <h2 class="tarjeta-nombre"></h2>
                <p class="estado"><span class="punto"></span><span class="estado-texto"></span></p>
                <dl>
                    <dt>Especie</dt>
                    <dd class="especie"></dd>
                    <dt>Género</dt>
                    <dd class="genero"></dd>
                    <dt>Origen</dt>
                    <dd class="origen"></dd>
                </dl>
            </div>
        </article>
    </template>

    <script src="js/app.js"></script>
</body>
</html>
